[project]
name = "zero-noise-sre"
version = "0.1.0"
description = "Autonomous Agentic SRE Core with In-Browser WebGPU / Local Gemma & Frontier LLM Support"
authors = [
    { name = "Zero-Noise SRE Team", email = "sre-core@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.2.1",
    "docker>=7.0.0",
    "gitpython>=3.1.43",
    "pygithub>=2.3.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.ingestion", "src.topology", "src.agent", "src.agent.tools", "src.sandbox", "src.remediation", "cmd.daemon"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
